name: Portal Acceptance

on:
  workflow_call:
    inputs:
      application:
        description: Canonical Ops Portal application id
        required: true
        type: string
      expected_release_sha:
        description: Release SHA the selected application must report
        required: true
        type: string
      portal_origin:
        description: Canonical operator portal origin
        required: false
        type: string
        default: https://ops.homesbliss.net
      relay_origin:
        description: ConoHa VPS relay used for canonical Portal acceptance
        required: false
        type: string
        default: https://seller-share.homesbliss.net/ops-portal-acceptance
    secrets:
      PORTAL_ACCEPTANCE_RELAY_TOKEN:
        required: true

jobs:
  canonical-portal-acceptance:
    name: Canonical Portal Acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Validate application input
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          case "$APPLICATION" in
            inquiry|tickets|order) ;;
            *) echo "::error::Unsupported Portal application: $APPLICATION"; exit 1 ;;
          esac

      - name: Validate expected release SHA input
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          if ! printf '%s' "$EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::expected_release_sha must be exactly 40 hexadecimal characters."
            exit 1
          fi

      - name: Verify exact operator route
        env:
          PORTAL_ORIGIN: ${{ inputs.portal_origin }}
          RELAY_ORIGIN: ${{ inputs.relay_origin }}
          RELAY_TOKEN: ${{ secrets.PORTAL_ACCEPTANCE_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#RELAY_TOKEN}" -lt 32 ]; then
            echo "::error::PORTAL_ACCEPTANCE_RELAY_TOKEN is missing or too short."
            exit 1
          fi
          PORTAL_ORIGIN="${PORTAL_ORIGIN%/}"
          RELAY_ORIGIN="${RELAY_ORIGIN%/}"
          HEADERS=(
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36 Homesbliss-Portal-Acceptance/1.0"
            -H "Authorization: Bearer $RELAY_TOKEN"
          )

          for APPLICATION in inquiry tickets order; do
            BODY="$RUNNER_TEMP/portal-$APPLICATION-body"
            RESPONSE_HEADERS="$RUNNER_TEMP/portal-$APPLICATION-headers"
            STATUS=$(curl -sS --max-time 30 -D "$RESPONSE_HEADERS" -o "$BODY" -w '%{http_code}' \
              "${HEADERS[@]}" "$RELAY_ORIGIN/accept?target=$APPLICATION")
            if [ "$STATUS" != "200" ]; then
              echo "::error::$PORTAL_ORIGIN/$APPLICATION/ returned HTTP $STATUS instead of 200"
              grep -Ei '^(server|cf-ray|cf-mitigated|location):' "$RESPONSE_HEADERS" || true
              exit 1
            fi
            grep -qi "^x-portal-acceptance-target: /$APPLICATION/" "$RESPONSE_HEADERS" || {
              echo "::error::Acceptance relay did not confirm the expected /$APPLICATION/ target."
              exit 1
            }
            grep -q 'aria-label="Operations portals"' "$BODY" || {
              echo "::error::Shared Ops navigation was not present on /$APPLICATION/."
              exit 1
            }
            grep -q 'data-ops-nav-version="1"' "$BODY" || {
              echo "::error::Shared Ops navigation contract version 1 was not present on /$APPLICATION/."
              exit 1
            }
            grep -qi '<html' "$BODY" || {
              echo "::error::/$APPLICATION/ did not return an HTML application shell."
              exit 1
            }
            grep -Eq "(href|src)=[\"']/$APPLICATION/assets/" "$BODY" || {
              echo "::error::/$APPLICATION/ did not expose an asset under /$APPLICATION/assets/."
              exit 1
            }
          done

      - name: Verify release contract
        env:
          PORTAL_ORIGIN: ${{ inputs.portal_origin }}
          RELAY_ORIGIN: ${{ inputs.relay_origin }}
          RELAY_TOKEN: ${{ secrets.PORTAL_ACCEPTANCE_RELAY_TOKEN }}
          APPLICATION: ${{ inputs.application }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          PORTAL_ORIGIN="${PORTAL_ORIGIN%/}"
          RELAY_ORIGIN="${RELAY_ORIGIN%/}"
          BODY="$RUNNER_TEMP/release.json"
          RESPONSE_HEADERS="$RUNNER_TEMP/release-headers"
          STATUS=$(curl -sS --max-time 30 -D "$RESPONSE_HEADERS" -o "$BODY" -w '%{http_code}' \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36 Homesbliss-Portal-Acceptance/1.0" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            "$RELAY_ORIGIN/accept?target=$APPLICATION-release")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Portal release endpoint for $APPLICATION returned HTTP $STATUS instead of 200."
            exit 1
          fi
          grep -qi "^x-portal-acceptance-target: /$APPLICATION/api/release" "$RESPONSE_HEADERS" || {
            echo "::error::Acceptance relay did not confirm the expected /$APPLICATION/api/release target."
            exit 1
          }
          jq -e --arg app "$APPLICATION" --arg sha "$EXPECTED_RELEASE_SHA" \
            '(.application == $app) and (.contract_version == 1) and ((.release_sha | ascii_downcase) == ($sha | ascii_downcase))' \
            "$BODY" >/dev/null || {
            echo "::error::Release contract mismatch for $APPLICATION (application, contract_version, or release_sha)."
            exit 1
          }

      - name: Verify Ticket Share capability contract
        env:
          PORTAL_ORIGIN: ${{ inputs.portal_origin }}
          RELAY_ORIGIN: ${{ inputs.relay_origin }}
          RELAY_TOKEN: ${{ secrets.PORTAL_ACCEPTANCE_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          PORTAL_ORIGIN="${PORTAL_ORIGIN%/}"
          RELAY_ORIGIN="${RELAY_ORIGIN%/}"
          BODY="$RUNNER_TEMP/ticket-health.json"
          RESPONSE_HEADERS="$RUNNER_TEMP/ticket-health-headers"
          STATUS=$(curl -sS --max-time 30 -D "$RESPONSE_HEADERS" -o "$BODY" -w '%{http_code}' \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36 Homesbliss-Portal-Acceptance/1.0" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            "$RELAY_ORIGIN/accept?target=ticket-health")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Portal Ticket capability endpoint returned HTTP $STATUS instead of 200."
            exit 1
          fi
          grep -qi '^x-portal-acceptance-target: /tickets/api/ticketing/health' "$RESPONSE_HEADERS" || {
            echo "::error::Acceptance relay did not confirm the Ticket health target."
            exit 1
          }
          jq -e '.status == "ok" and .ticket_shares_enabled == true' "$BODY" >/dev/null || {
            echo "::error::Ticket Share is not enabled through the canonical Portal API namespace."
            exit 1
          }

      - name: Record acceptance evidence
        run: |
          {
            echo "### Canonical Portal Acceptance"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application | \`${{ inputs.application }}\` |"
            echo "| Exact route | \`${{ inputs.portal_origin }}/${{ inputs.application }}/\` |"
            echo "| Expected release SHA | \`${{ inputs.expected_release_sha }}\` |"
            echo "| Source commit | \`${{ github.sha }}\` |"
            echo "| Result | passed |"
          } >> "$GITHUB_STEP_SUMMARY"
